<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>


<h1>Game Profiles</h1>
<hr>
<br>

<table>
  <thead>
  <tr>
    <td>ID</td>
    <td>Nickname</td>
    <td>Level</td>
    <td>FavoriteGame</td>
      <td>Player name</td>
  </tr>
  </thead>

  <!-- Gli oggetti, essendo accoppiati, diventano navigabili, cioè si può passare da uno all’altro
  (es: customer.address.street), dall’oggetto customer si accede all’oggetto address -->

  <tbody>
  <tr th:each="gameProfile : ${gameProfile1000}">
    <td th:text="${gameProfile.id}"></td>
    <td th:text="${gameProfile.nickname}"></td>
    <td th:text="${gameProfile.level}"></td>
    <td th:text="${gameProfile.favoriteGame}"></td>
    <td th:text="${gameProfile.player}"></td>
  </tr>
  </tbody>
</table>

</body>
</html>
