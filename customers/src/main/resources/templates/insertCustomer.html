<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Insert Customer</title>
    <link rel="stylesheet" href="/css/styleCSS.css">
</head>
<body>
<h1>Insert customer:</h1>
<hr><br>

<form method="POST" th:action="@{/customers/insert}" th:object="${customer}">
    <div>
        <label for="name">Nome:</label>
        <input type="text" id="name" th:field="${customer.name}" placeholder="Inserisci il nome" required/>
        <span class="validationError"
              th:if="${#fields.hasErrors('name')}"
              th:errors="${customer.name}">Name Error
        </span>
    </div>
    <div>
        <label for="cognome">Cognome:</label>
        <input type="text" id="cognome" th:field="${customer.surname}" placeholder="Inserisci il cognome" required/>
        <span class="validationError"
              th:if="${#fields.hasErrors('surname')}"
              th:errors="${customer.surname}">Surname Error
        </span>
    </div>
    <div>
        <label for="age">Età:</label>
        <input type="number" id="age" th:field="${customer.age}" placeholder="Inserisci l'età" required/>
        <span class="validationError"
              th:if="${#fields.hasErrors('age')}"
              th:errors="${customer.age}">Age Error
        </span>
    </div>
    <div>
        <label for="street">Nome della Strada:</label>
        <input type="text" id="street" th:field="${customer.address.street}" placeholder="Inserisci la strada" required/>
        <span class="validationError"
              th:if="${#fields.hasErrors('address.street')}"
              th:errors="${customer.address.street}">Street Error
        </span>
    </div>
    <div>
        <label for="num">Numero di indirizzo:</label>
        <input type="text" id="num" th:field="${customer.address.num}" placeholder="Inserisci il numero" required/>
        <span class="validationError"
              th:if="${#fields.hasErrors('address.num')}"
              th:errors="${customer.address.num}">Num Error
        </span>
    </div>
    <div>
        <label for="zip">Zip:</label>
        <input type="text" id="zip" th:field="${customer.address.zip}" placeholder="Inserisci lo ZIP" required/>
        <span class="validationError"
              th:if="${#fields.hasErrors('address.zip')}"
              th:errors="${customer.address.zip}">Zip Error
        </span>
    </div>
    <div>
        <label for="city">Città:</label>
        <input type="text" id="city" th:field="${customer.address.city}" placeholder="Inserisci la città" required/>
        <span class="validationError"
              th:if="${#fields.hasErrors('address.city')}"
              th:errors="${customer.address.city}">City Error
        </span>
    </div>
    <div>
        <label for="nation">Nazione:</label>
        <input type="text" id="nation" th:field="${customer.address.nation}" placeholder="Inserisci la nazione" required/>
        <span class="validationError"
              th:if="${#fields.hasErrors('address.nation')}"
              th:errors="${customer.address.nation}">Nation Error
        </span>
    </div>

    <div>
        <button type="submit">Inserisci customer</button>
    </div>
</form>

<br><br><hr>
<nav class="main-nav">
    <a href="/customers">Tutti i clienti</a>
    <a href="/customers/insert">Inserisci cliente</a>
</nav>

</body>
</html>
